<!doctype html>
<html lang="@@LANG@@" data-theme="@@THEME@@" data-mode="@@MODE@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="Code Review Lifecycle">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>@@TITLE@@</title>
<style>
:root{--bg:#f4f6f8;--paper:#fff;--ink:#172336;--muted:#52637a;--line:#9baec3;--accent:#184883;--bar:#193557;--bar-ink:#fff;--soft:#eaf1f9;--warn:#fff4dc;--warn-ink:#764608;--ok:#e7f5ec;--ok-ink:#24634b;--err:#fbe9e9;--err-ink:#922e32;--radius:0px;color-scheme:light}
:root[data-theme="shadcn"]{--radius:10px;--bar:#172336;--line:#c0cbd7}
:root[data-mode="dark"]{--bg:#101723;--paper:#172235;--ink:#e5eef9;--muted:#b6c5d9;--line:#526785;--accent:#a2ccff;--bar:#223550;--bar-ink:#e5eef9;--soft:#263953;--warn:#48351a;--warn-ink:#ffd891;--ok:#153c2d;--ok-ink:#9fe1be;--err:#4a2529;--err-ink:#ffd1d1;color-scheme:dark}
@media(prefers-color-scheme:dark){:root[data-mode="auto"]{--bg:#101723;--paper:#172235;--ink:#e5eef9;--muted:#b6c5d9;--line:#526785;--accent:#a2ccff;--bar:#223550;--bar-ink:#e5eef9;--soft:#263953;--warn:#48351a;--warn-ink:#ffd891;--ok:#153c2d;--ok-ink:#9fe1be;--err:#4a2529;--err-ink:#ffd1d1;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}
header,main{max-width:1100px;margin:auto;padding-inline:26px}
header{padding-top:25px;padding-bottom:16px}
a{color:var(--accent);text-underline-offset:.18em;overflow-wrap:anywhere}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1{font-size:clamp(1.55rem,4vw,2.3rem);line-height:1.2;margin:.55rem 0 .28rem}
.subtitle,.source-note,.page-credit{color:var(--muted);margin:.15rem 0}
.page-credit,.source-note{font-size:.8rem}
main{padding-bottom:35px}
.panel-grid{display:grid;grid-template-columns:repeat(@@COLS@@,minmax(0,1fr));gap:16px}
.panel{grid-column:span var(--span);min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel h2{display:flex;align-items:center;gap:.65em;margin:0;padding:.55rem .85rem;background:var(--bar);color:var(--bar-ink);font-size:1rem}
.panel-key{display:inline-grid;place-items:center;min-width:1.5rem;min-height:1.5rem;border:1px solid currentColor;font:700 .8rem ui-monospace,monospace}
.panel-body{padding:14px 16px}
.panel-body>:first-child,.intro>:first-child{margin-top:0}
.panel-body>:last-child,.intro>:last-child{margin-bottom:0}
.intro{margin:0 0 16px}
p{margin:.55rem 0}
ul,ol{margin:.55rem 0;padding-left:1.45rem}
blockquote{margin:.7rem 0;padding:.35rem .8rem;border-left:3px solid var(--line);background:var(--soft)}
code,pre{font-family:ui-monospace,Consolas,monospace}
code{background:var(--soft);padding:.08em .25em;overflow-wrap:anywhere}
pre{overflow:auto;margin:.6rem 0;padding:.7rem;background:var(--soft)}
pre code{padding:0;overflow-wrap:normal}
.table-scroll{overflow-x:auto;margin:.55rem 0}
table{width:100%;border-collapse:collapse}
th,td{padding:.45rem .55rem;border:1px solid var(--line);text-align:left;vertical-align:top;min-width:5ch}
th{background:var(--soft)}
.facts{display:grid;grid-template-columns:repeat(var(--fact-cols),minmax(0,1fr));margin:.6rem 0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.facts>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:.5rem .65rem;overflow-wrap:anywhere}
.facts .wide{grid-column:1/-1}
dt{color:var(--muted);font-size:.78rem}
dd{margin:0;font-weight:650}
.callout{margin:.6rem 0;padding:.6rem .8rem;border-left:3px solid currentColor;background:var(--soft)}
.badge{display:inline-block;padding:.08rem .35rem;background:var(--soft)}
.warn{background:var(--warn);color:var(--warn-ink)}
.ok{background:var(--ok);color:var(--ok-ink)}
.err,.no{background:var(--err);color:var(--err-ink)}
.flow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.flow span{padding:.35rem .5rem;border:1px solid var(--line);background:var(--soft)}
@media(max-width:700px){header,main{padding-inline:14px}.panel-grid{grid-template-columns:minmax(0,1fr)}.panel{grid-column:1}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{body{background:white;color:black}.panel{break-inside:avoid}.panel h2{background:#eee;color:black}}
</style>
</head>
<body>
<header>
<p class="page-credit">Generated by <a href="https://github.com/HoeTee/code-review-lifecycle-skill" target="_blank" rel="noopener">code-review-lifecycle-skill</a> · <a href="https://github.com/HoeTee/code-review-lifecycle-skill" target="_blank" rel="noopener">★ Star on GitHub</a></p>
<h1>@@TITLE@@</h1>
@@SUBTITLE@@
@@META@@
</header>
<main>
@@INTRO@@
<div class="panel-grid">@@CONTENT@@</div>
</main>
<script id="review-source" type="application/json">@@SOURCE@@</script>
</body>
</html>
