<svg class="am-diagram" viewBox="0 0 660 736" width="660" height="736" role="img" aria-label="Flowchart: Local change or existing PR, Trusted project rules, Pin scope and version, AI review (max 3 total), Authorized repair, Local report, Current PR and CI, Human decision" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[.am-diagram{ margin: 0; overflow-x: auto; text-align: center; }
.am-diagram svg{ max-width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, "Helvetica Neue", Arial, sans-serif; }
.am-diagram text{ fill: #16181d; font-size: inherit; }
.am-node-shape{ fill: #ffffff; stroke: #1d2026; stroke-width: 1.5px; filter: none; }
.am-node-shape ~ .am-node-shape{ filter: none; }
.am-node--rect .am-node-shape, .am-node--er .am-node-shape{ rx: 3px; }
.am-node--hi .am-node-shape{ fill: #e4ecf8; stroke: #1d5fbf; }
.am-diagram .am-node-text{ fill: #16181d; }
.am-node--hi text{ fill: #1d5fbf; font-weight: 600; }
.am-diagram .am-node--hi .am-node-text{ fill: #1d5fbf; }
.am-edge{ fill: none; stroke: #4b5260; stroke-width: 1.3; }
.am-edge--dashed{ stroke-dasharray: 5 4; }
.am-arrow{ fill: #4b5260; }
.am-edge-label rect{ fill: #ffffff; }
.am-diagram .am-edge-label text{ fill: #1d5fbf; font-size: inherit; }
.am-diagram .am-cluster-label{ fill: #4b5260; font: inherit ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.am-diagram .am-er-key{ fill: #4b5260; }
.am-diagram .am-node--hi .am-er-key{ fill: #4b5260; }
.am-diagram .am-actor-text{ fill: #16181d; }
.am-diagram .am-step{ fill: #8b929e; font: inherit ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.am-diagram-expand{
  /* In flow and sticky: it sits at the end edge (right on a left-to-right page) and stays in view when the diagram scrolls sideways.
     It takes its own row above the drawing, so it never covers a node at the top-right corner of the drawing. */
  position: sticky; inset-inline-start: calc(100% - 36px); z-index: 2;
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0; margin: 0 0 4px; margin-inline: auto 8px;
  color: #4b5260; background: #ffffff;
  border: 1.5px solid #d6dae1; border-radius: 0px;
  cursor: pointer; opacity: 0.72;
  transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
}
.am-diagram:hover .am-diagram-expand,
.am-diagram-expand:focus-visible{ opacity: 1; }
.am-diagram-expand:hover{
  opacity: 1; color: #16181d; border-color: #1d5fbf; background: #f3f5f8;
}
.am-diagram-expand:focus-visible{ outline: 2px solid #1d5fbf; outline-offset: 1px; }
.am-diagram svg{ max-width: none; }
.am-toolbar, .am-diagram-expand, .am-lightbox, .am-code-copy, .am-toc, .am-comment-btn, .am-comment, .am-reply, .am-reply-bar{ display: none !important; }]]></style><defs><marker id="am1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><g></g><g><g data-step="0"><path class="am-edge" d="M172.4,66 L172.4,77.5 Q172.4,89 172.4,100.5 L172.4,112" marker-end="url(#am1-arrow)"/></g><g data-step="1"><path class="am-edge" d="M172.4,147 L172.4,158.5 Q172.4,170 172.4,181.5 L172.4,193" marker-end="url(#am1-arrow)"/></g><g data-step="2"><path class="am-edge" d="M172.4,228 L172.4,239.5 Q172.4,251 172.4,262.5 L172.4,274" marker-end="url(#am1-arrow)"/></g><g data-step="3"><path class="am-edge" d="M222.8,309 L268.9,325 Q314.9,341 314.9,365.8 Q314.9,390.5 314.9,415.3 Q314.9,440 314.9,464.8 Q314.9,489.5 314.9,514.3 Q314.9,539 280.2,555 L245.4,571" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="230.5" y="431" width="168.9" height="18" rx="3"/><text x="314.9" y="440" text-anchor="middle" dominant-baseline="central">confirmed issue + permission</text></g></g><g data-step="4"><path class="am-edge am-edge--dashed" d="M188.9,571 L172,555 Q155.1,539 155.1,514.3 Q155.1,489.5 155.1,464.8 Q155.1,440 155.1,415.3 Q155.1,390.5 155.1,365.8 Q155.1,341 160.7,325 L166.3,309" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="101.6" y="431" width="106.8" height="18" rx="3"/><text x="155.1" y="440" text-anchor="middle" dominant-baseline="central">verify + re-review</text></g></g><g data-step="5"><path class="am-edge" d="M136.4,309 L103.5,325 Q70.5,341 70.5,357 L70.5,373" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="19.6" y="332" width="101.8" height="18" rx="3"/><text x="70.5" y="341" text-anchor="middle" dominant-baseline="central">local-only scope</text></g></g><g data-step="6"><path class="am-edge" d="M255.6,304.1 L376.9,322.6 Q498.2,341 498.2,357 L498.2,373" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="460.7" y="332" width="74.9" height="18" rx="3"/><text x="498.2" y="341" text-anchor="middle" dominant-baseline="central">PR in scope</text></g></g><g data-step="7"><path class="am-edge" d="M498.2,408 L498.2,424 Q498.2,440 498.2,456 L498.2,472" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="421.4" y="431" width="153.5" height="18" rx="3"/><text x="498.2" y="440" text-anchor="middle" dominant-baseline="central">checks pass + no blockers</text></g></g><g data-step="8"><path class="am-edge am-edge--dashed" d="M435.3,501.3 L335.1,520.2 Q235,539 226.1,555 L217.2,571" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="186" y="530" width="98.1" height="18" rx="3"/><text x="235" y="539" text-anchor="middle" dominant-baseline="central">request changes</text></g></g><g data-step="9"><path class="am-edge" d="M476,507 L455.8,523 Q435.6,539 435.6,555 L435.6,571" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="417.2" y="530" width="36.7" height="18" rx="3"/><text x="435.6" y="539" text-anchor="middle" dominant-baseline="central">defer</text></g></g><g data-step="10"><path class="am-edge" d="M520.3,507 L540.5,523 Q560.8,539 560.8,555 L560.8,571" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="534.6" y="530" width="52.3" height="18" rx="3"/><text x="560.8" y="539" text-anchor="middle" dominant-baseline="central">approve</text></g></g><g data-step="11"><path class="am-edge" d="M560.8,606 L560.8,622 Q560.8,638 560.8,654 L560.8,670" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="512.3" y="629" width="96.9" height="18" rx="3"/><text x="560.8" y="638" text-anchor="middle" dominant-baseline="central">rules + authority</text></g></g></g><g><g class="am-node am-node--round" data-key="Local change or existing PR" data-step="0"><rect class="am-node-shape" x="103.5" y="14" width="137.8" height="52" rx="26"/><text x="172.4" y="31.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Local change or</text><text x="172.4" y="48.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">existing PR</text></g><g class="am-node am-node--rect" data-key="Trusted project rules" data-step="0"><rect class="am-node-shape" x="95.5" y="112" width="153.8" height="35" rx="3"/><text x="172.4" y="129.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Trusted project rules</text></g><g class="am-node am-node--rect" data-key="Pin scope and version" data-step="1"><rect class="am-node-shape" x="90.9" y="193" width="162.9" height="35" rx="3"/><text x="172.4" y="210.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Pin scope and version</text></g><g class="am-node am-node--rect" data-key="AI review (max 3 total)" data-step="2"><rect class="am-node-shape" x="89.2" y="274" width="166.3" height="35" rx="3"/><text x="172.4" y="291.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">AI review (max 3 total)</text></g><g class="am-node am-node--rect" data-key="Authorized repair" data-step="3"><rect class="am-node-shape" x="141.8" y="571" width="131.2" height="35" rx="3"/><text x="207.4" y="588.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Authorized repair</text></g><g class="am-node am-node--round" data-key="Local report" data-step="5"><rect class="am-node-shape" x="14" y="373" width="113.1" height="35" rx="17.5"/><text x="70.5" y="390.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Local report</text></g><g class="am-node am-node--rect" data-key="Current PR and CI" data-step="6"><rect class="am-node-shape" x="430.5" y="373" width="135.4" height="35" rx="3"/><text x="498.2" y="390.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Current PR and CI</text></g><g class="am-node am-node--rect am-node--hi" data-key="Human decision" data-step="7"><rect class="am-node-shape" x="435.3" y="472" width="125.8" height="35" rx="3"/><text x="498.2" y="489.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Human decision</text></g><g class="am-node am-node--round" data-key="Defer" data-step="9"><rect class="am-node-shape" x="397.6" y="571" width="76" height="35" rx="17.5"/><text x="435.6" y="588.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Defer</text></g><g class="am-node am-node--rect" data-key="Merge gates" data-step="10"><rect class="am-node-shape" x="509.6" y="571" width="102.4" height="35" rx="3"/><text x="560.8" y="588.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Merge gates</text></g><g class="am-node am-node--round" data-key="Handoff or authorized merge" data-step="11"><rect class="am-node-shape" x="476.3" y="670" width="169" height="52" rx="26"/><text x="560.8" y="687.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Handoff or authorized</text><text x="560.8" y="704.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">merge</text></g></g></svg>