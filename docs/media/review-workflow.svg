<svg class="am-diagram" viewBox="0 0 548 986" width="548" height="986" role="img" aria-label="Flowchart: Local change or existing PR, Trusted project rules, Pin scope and version, AI review, AI repair, AI verification, Local result and report, Current PR and CI" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[.am-diagram{ margin: 0; overflow-x: auto; text-align: center; }
.am-diagram svg{ max-width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, "Helvetica Neue", Arial, sans-serif; }
.am-diagram text{ fill: #16181d; font-size: inherit; }
.am-node-shape{ fill: #ffffff; stroke: #1d2026; stroke-width: 1.5px; filter: none; }
.am-node-shape ~ .am-node-shape{ filter: none; }
.am-node--rect .am-node-shape, .am-node--er .am-node-shape{ rx: 3px; }
.am-node--hi .am-node-shape{ fill: #e4ecf8; stroke: #1d5fbf; }
.am-diagram .am-node-text{ fill: #16181d; }
.am-node--hi text{ fill: #1d5fbf; font-weight: 600; }
.am-diagram .am-node--hi .am-node-text{ fill: #1d5fbf; }
.am-edge{ fill: none; stroke: #4b5260; stroke-width: 1.3; }
.am-edge--dashed{ stroke-dasharray: 5 4; }
.am-arrow{ fill: #4b5260; }
.am-edge-label rect{ fill: #ffffff; }
.am-diagram .am-edge-label text{ fill: #1d5fbf; font-size: inherit; }
.am-cluster{ fill: #f3f5f8; stroke: #d6dae1; stroke-width: 1; stroke-dasharray: 4 3; }
.am-diagram .am-cluster-label{ fill: #4b5260; font: inherit ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.am-diagram .am-er-key{ fill: #4b5260; }
.am-diagram .am-node--hi .am-er-key{ fill: #4b5260; }
.am-diagram .am-actor-text{ fill: #16181d; }
.am-diagram .am-step{ fill: #8b929e; font: inherit ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.am-diagram-expand{
  /* In flow and sticky: it sits at the end edge (right on a left-to-right page) and stays in view when the diagram scrolls sideways.
     It takes its own row above the drawing, so it never covers a node at the top-right corner of the drawing. */
  position: sticky; inset-inline-start: calc(100% - 36px); z-index: 2;
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0; margin: 0 0 4px; margin-inline: auto 8px;
  color: #4b5260; background: #ffffff;
  border: 1.5px solid #d6dae1; border-radius: 0px;
  cursor: pointer; opacity: 0.72;
  transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
}
.am-diagram:hover .am-diagram-expand,
.am-diagram-expand:focus-visible{ opacity: 1; }
.am-diagram-expand:hover{
  opacity: 1; color: #16181d; border-color: #1d5fbf; background: #f3f5f8;
}
.am-diagram-expand:focus-visible{ outline: 2px solid #1d5fbf; outline-offset: 1px; }
.am-diagram svg{ max-width: none; }
.am-toolbar, .am-diagram-expand, .am-lightbox, .am-code-copy, .am-toc, .am-comment-btn, .am-comment, .am-reply, .am-reply-bar{ display: none !important; }]]></style><defs><marker id="am1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="am-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><g><rect class="am-cluster" x="35.4" y="286" width="475.7" height="261" rx="4"/><text class="am-cluster-label" x="43.4" y="300">AI stage</text></g><g><g data-step="0"><path class="am-edge" d="M254.4,78 L254.4,89.5 Q254.4,101 254.4,112.5 L254.4,124" marker-end="url(#am1-arrow)"/></g><g data-step="1"><path class="am-edge" d="M254.4,159 L254.4,170.5 Q254.4,182 254.4,193.5 L254.4,205" marker-end="url(#am1-arrow)"/></g><g data-step="2"><path class="am-edge" d="M254.4,240 L254.4,251.5 Q254.4,263 254.4,274.5 Q254.4,286 254.4,297.5 L254.4,309" marker-end="url(#am1-arrow)"/></g><g data-step="3"><path class="am-edge" d="M297.5,341.3 L348.1,358.6 Q398.7,376 398.7,392 L398.7,408" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="307.4" y="367" width="182.7" height="18" rx="3"/><text x="398.7" y="376" text-anchor="middle" dominant-baseline="central">confirmed defect, rounds remain</text></g></g><g data-step="4"><path class="am-edge" d="M211.3,340.5 L156.6,358.3 Q102,376 102,400.8 Q102,425.5 102,445.8 Q102,466 146.4,478.4 L190.8,490.7" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="60.9" y="416.5" width="82.2" height="18" rx="3"/><text x="102" y="425.5" text-anchor="middle" dominant-baseline="central">no fix needed</text></g></g><g data-step="5"><path class="am-edge" d="M398.7,443 L398.7,454.5 Q398.7,466 351.5,478.6 L304.4,491.3" marker-end="url(#am1-arrow)"/></g><g data-step="6"><path class="am-edge am-edge--dashed" d="M247.6,489 L247.6,477.5 Q247.6,466 247.6,445.8 Q247.6,425.5 247.6,400.8 Q247.6,376 249.8,360 L252,344" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="165.1" y="416.5" width="165" height="18" rx="3"/><text x="247.6" y="425.5" text-anchor="middle" dominant-baseline="central">revised code, max 3 reviews</text></g></g><g data-step="7"><path class="am-edge" d="M304.4,518.2 L374.6,532.6 Q444.9,547 444.9,563 Q444.9,579 444.9,595 L444.9,611" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="374.9" y="570" width="140" height="18" rx="3"/><text x="444.9" y="579" text-anchor="middle" dominant-baseline="central">local-only, review clear</text></g></g><g data-step="8"><path class="am-edge" d="M210.2,524 L185.6,535.5 Q161.1,547 161.1,563 Q161.1,579 161.1,595 L161.1,611" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="86.7" y="570" width="148.7" height="18" rx="3"/><text x="161.1" y="579" text-anchor="middle" dominant-baseline="central">PR in scope, review clear</text></g></g><g data-step="9"><path class="am-edge" d="M161.1,646 L161.1,662 Q161.1,678 161.1,694 L161.1,710" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="84.3" y="669" width="153.5" height="18" rx="3"/><text x="161.1" y="678" text-anchor="middle" dominant-baseline="central">checks pass + no blockers</text></g></g><g data-step="10"><path class="am-edge" d="M183.2,745 L203.4,761 Q223.7,777 223.7,793 L223.7,809" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="205.3" y="768" width="36.7" height="18" rx="3"/><text x="223.7" y="777" text-anchor="middle" dominant-baseline="central">defer</text></g></g><g data-step="11"><path class="am-edge" d="M138.9,745 L118.7,761 Q98.5,777 98.5,793 L98.5,809" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="72.3" y="768" width="52.3" height="18" rx="3"/><text x="98.5" y="777" text-anchor="middle" dominant-baseline="central">approve</text></g></g><g data-step="12"><path class="am-edge" d="M98.5,844 L98.5,860 Q98.5,876 98.5,892 L98.5,908" marker-end="url(#am1-arrow)"/><g class="am-edge-label"><rect x="50" y="867" width="96.9" height="18" rx="3"/><text x="98.5" y="876" text-anchor="middle" dominant-baseline="central">rules + authority</text></g></g></g><g><g class="am-node am-node--round" data-key="Local change or existing PR" data-step="0"><rect class="am-node-shape" x="185.5" y="26" width="137.8" height="52" rx="26"/><text x="254.4" y="43.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Local change or</text><text x="254.4" y="60.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">existing PR</text></g><g class="am-node am-node--rect" data-key="Trusted project rules" data-step="0"><rect class="am-node-shape" x="177.5" y="124" width="153.8" height="35" rx="3"/><text x="254.4" y="141.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Trusted project rules</text></g><g class="am-node am-node--rect" data-key="Pin scope and version" data-step="1"><rect class="am-node-shape" x="173" y="205" width="162.9" height="35" rx="3"/><text x="254.4" y="222.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Pin scope and version</text></g><g class="am-node am-node--rect" data-key="AI review" data-step="2"><rect class="am-node-shape" x="211.3" y="309" width="86.2" height="35" rx="3"/><text x="254.4" y="326.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">AI review</text></g><g class="am-node am-node--rect" data-key="AI repair" data-step="3"><rect class="am-node-shape" x="359.1" y="408" width="79.2" height="35" rx="3"/><text x="398.7" y="425.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">AI repair</text></g><g class="am-node am-node--rect" data-key="AI verification" data-step="4"><rect class="am-node-shape" x="190.8" y="489" width="113.5" height="35" rx="3"/><text x="247.6" y="506.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">AI verification</text></g><g class="am-node am-node--round" data-key="Local result and report" data-step="7"><rect class="am-node-shape" x="356.4" y="611" width="177" height="35" rx="17.5"/><text x="444.9" y="628.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Local result and report</text></g><g class="am-node am-node--rect" data-key="Current PR and CI" data-step="8"><rect class="am-node-shape" x="93.4" y="611" width="135.4" height="35" rx="3"/><text x="161.1" y="628.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Current PR and CI</text></g><g class="am-node am-node--rect am-node--hi" data-key="Final human check" data-step="9"><rect class="am-node-shape" x="89" y="710" width="144.2" height="35" rx="3"/><text x="161.1" y="727.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Final human check</text></g><g class="am-node am-node--round" data-key="Defer" data-step="10"><rect class="am-node-shape" x="185.7" y="809" width="76" height="35" rx="17.5"/><text x="223.7" y="826.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Defer</text></g><g class="am-node am-node--rect" data-key="Merge gates" data-step="11"><rect class="am-node-shape" x="47.3" y="809" width="102.4" height="35" rx="3"/><text x="98.5" y="826.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Merge gates</text></g><g class="am-node am-node--round" data-key="Handoff or authorized merge" data-step="12"><rect class="am-node-shape" x="14" y="908" width="169" height="52" rx="26"/><text x="98.5" y="925.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">Handoff or authorized</text><text x="98.5" y="942.5" text-anchor="middle" dominant-baseline="central" class="am-node-text">merge</text></g></g></svg>